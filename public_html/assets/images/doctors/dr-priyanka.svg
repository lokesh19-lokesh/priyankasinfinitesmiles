<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="docBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FAF9"/>
      <stop offset="100%" stop-color="#E5EEEE"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#e2ebec"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#docBg)"/>
  <circle cx="300" cy="320" r="220" fill="#79CFC5" opacity="0.2"/>
  <!-- Doctor Figure (Professional Dental Surgeon) -->
  <!-- Coat -->
  <path d="M 120 700 L 160 480 C 180 430, 240 410, 300 410 C 360 410, 420 430, 440 480 L 480 700 Z" fill="url(#coatGrad)"/>
  <!-- Inner Scrub Teal -->
  <path d="M 250 410 L 300 490 L 350 410 Z" fill="#075B59"/>
  <!-- Lapels -->
  <path d="M 230 420 L 260 550 L 220 540 Z" fill="#FFFFFF"/>
  <path d="M 370 420 L 340 550 L 380 540 Z" fill="#FFFFFF"/>
  <!-- Head &amp; Hair Silhouette -->
  <ellipse cx="300" cy="270" rx="80" ry="95" fill="#f0d5be"/>
  <!-- Elegant Hair -->
  <path d="M 210 270 C 200 170, 240 130, 300 130 C 360 130, 400 170, 390 270 C 390 320, 385 360, 400 420 C 380 430, 360 360, 360 320 C 360 320, 350 180, 300 180 C 250 180, 240 320, 240 320 C 240 360, 220 430, 200 420 C 215 360, 210 320, 210 270 Z" fill="#2d2320"/>
  <!-- Subtle smile &amp; features -->
  <path d="M 285 315 Q 300 328 315 315" stroke="#a3604f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="275" cy="265" rx="6" ry="4" fill="#30201d"/>
  <ellipse cx="325" cy="265" rx="6" ry="4" fill="#30201d"/>
  <!-- Doctor Stethoscope / Magnifying Dental Loupe cord -->
  <path d="M 235 440 C 235 550, 365 550, 365 440" stroke="#79CFC5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="300" cy="540" r="14" fill="#D7B98E"/>
  <!-- Trust Badge Overlay at Bottom -->
  <g transform="translate(60, 580)">
    <rect width="480" height="90" rx="18" fill="#FFFFFF" filter="drop-shadow(0 10px 20px rgba(7,91,89,0.12))"/>
    <text x="30" y="38" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#075B59">Dr. Priyanka Vijayakumar</text>
    <text x="30" y="58" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#8c6a37">MDS, FELLOW IN COSMETIC DENTISTRY &amp; IMPLANTOLOGY</text>
    <text x="30" y="74" font-family="'DM Sans', sans-serif" font-size="11" fill="#647579">10+ Years Experience • SumanTV Doctor Award Winner</text>
  </g>
</svg>