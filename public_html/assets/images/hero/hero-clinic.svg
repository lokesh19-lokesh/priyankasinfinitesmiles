<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#043836"/>
      <stop offset="50%" stop-color="#075B59"/>
      <stop offset="100%" stop-color="#0b6b68"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3ECEB"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79CFC5"/>
      <stop offset="100%" stop-color="#D7B98E"/>
    </linearGradient>
    <linearGradient id="lampBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79CFC5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#79CFC5" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="600" fill="url(#bgH)"/>
  
  <!-- Architectural Perspective & Grid Lines -->
  <line x1="60" y1="80" x2="740" y2="80" stroke="#79CFC5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#79CFC5" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="60" y1="520" x2="740" y2="520" stroke="#79CFC5" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Ambient Soft Bokeh / Glow Circles -->
  <circle cx="720" cy="90" r="220" fill="#79CFC5" opacity="0.1"/>
  <circle cx="120" cy="480" r="260" fill="#D7B98E" opacity="0.07"/>

  <!-- Digital 3D Intraoral Screen Monitor (Upper-Left Quadrant) -->
  <rect x="90" y="110" width="170" height="115" rx="12" fill="#0d3432" stroke="#79CFC5" stroke-width="3"/>
  <rect x="98" y="118" width="154" height="99" rx="8" fill="#052827"/>
  <!-- Waveform / 3D Teeth Scan on Monitor -->
  <path d="M 112 175 C 130 145, 150 205, 170 155 C 190 185, 210 135, 230 170" stroke="#79CFC5" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="170" cy="155" r="6" fill="#D7B98E"/>
  <circle cx="170" cy="155" r="10" stroke="#D7B98E" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="110" y="142" font-family="'DM Sans', sans-serif" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.5">3D SCAN: READY</text>
  <text x="110" y="202" font-family="'DM Sans', sans-serif" font-size="9" fill="#79CFC5" font-weight="500">High-Precision Digital CAD</text>
  <!-- Monitor Stand -->
  <line x1="175" y1="225" x2="175" y2="340" stroke="#172D32" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="175" cy="340" rx="35" ry="8" fill="#072423"/>

  <!-- Operatory Lamp Beam onto Chair -->
  <polygon points="480,185 410,420 570,420" fill="url(#lampBeam)"/>

  <!-- Advanced Dental Chair (Center-Right Quadrant) -->
  <!-- Hydraulic Base & Platform -->
  <ellipse cx="490" cy="525" rx="110" ry="18" fill="#031d1c"/>
  <rect x="460" y="450" width="60" height="75" rx="6" fill="#172D32"/>
  <rect x="470" y="460" width="40" height="55" rx="3" fill="#0d3432"/>
  
  <!-- Chair Seat Cushions -->
  <path d="M 350 450 L 590 450 C 605 450, 615 440, 615 425 L 605 380 L 535 360 L 460 355 L 390 375 L 350 415 Z" fill="url(#chairGrad)" opacity="0.98"/>
  <!-- Chair Backrest -->
  <path d="M 535 360 L 610 240 C 618 228, 630 228, 642 235 L 675 258 C 686 268, 682 284, 670 295 L 605 365 Z" fill="#FFFFFF"/>
  <!-- Headrest -->
  <rect x="640" y="200" width="68" height="38" rx="10" fill="#D7B98E" opacity="0.9"/>
  <rect x="646" y="206" width="56" height="26" rx="6" fill="#e2caa5"/>
  <!-- Armrest Accent -->
  <rect x="430" y="375" width="110" height="16" rx="8" fill="#79CFC5" opacity="0.85"/>

  <!-- Overhead Dental Operatory Lamp -->
  <path d="M 550 50 L 560 135 L 485 170" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <rect x="450" y="160" width="75" height="26" rx="9" fill="#FFFFFF"/>
  <ellipse cx="487" cy="173" rx="24" ry="7" fill="#79CFC5" opacity="0.9"/>

  <!-- Subtle Equipment Tray / Instrument Bridge -->
  <path d="M 360 415 L 320 415 L 320 370" stroke="#79CFC5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <rect x="285" y="358" width="65" height="14" rx="4" fill="#E5EEEE" opacity="0.9"/>
  <line x1="292" y1="365" x2="342" y2="365" stroke="#075B59" stroke-width="2" stroke-dasharray="3,3"/>
</svg>